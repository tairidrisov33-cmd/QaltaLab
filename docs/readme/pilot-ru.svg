if">75,9% · 22/29</text><text x="60" y="502" font-size="16" fill="#182B24" font-weight="600" font-family="'Segoe UI', Manrope, Arial, sans-serif">Простота</text><rect x="370" y="490" width="400" height="14" rx="7" fill="#E2ECDD"/><rect x="370" y="490" width="303" height="14" rx="7" fill="#426D4F"/><text x="790" y="502" font-size="14" fill="#5F6B63" font-weight="600" font-family="'Segoe UI', Manrope, Arial, sans-serif">75,9% · 22/29</text><text x="60" y="548" font-size="16" fill="#182B24" font-weight="600" font-family="'Segoe UI', Manrope, Arial, sans-serif">Русский и казахский языки</text><rect x="370" y="536" width="400" height="14" rx="7" fill="#E2ECDD"/><rect x="370" y="536" width="262" height="14" rx="7" fill="#426D4F"/><text x="790" y="548" font-size="14" fill="#5F6B63" font-weight="600" font-family="'Segoe UI', Manrope, Arial, sans-serif">65,5% · 19/29</text><text x="40" y="594" font-size="15" fill="#182B24" font-weight="400" font-family="'Segoe UI', Manrope, Arial, sans-serif">75,9% точно хотели бы использовать QaltaLab на уроках или дома (22/29), ещё 24,1% — «возможно» (7/29).</text><text x="40" y="622" font-size="13" fill="#5F6B63" font-weight="400" font-family="'Segoe UI', Manrope, Arial, sans-serif">Пилотное тестирование, n = 29.</text></svg>
