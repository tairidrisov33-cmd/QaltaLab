<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-label="Пилотное тестирование"><title>Пилотное тестирование</title><rect width="960" height="640" rx="20" fill="#FBFAF4"/><text x="40" y="58" font-size="30" fill="#182B24" font-weight="700" font-family="'Segoe UI', Manrope, Arial, sans-serif">Пилотное тестирование</text><text x="40" y="90" font-size="17" fill="#5F6B63" font-weight="400" font-family="'Segoe UI', Manrope, Arial, sans-serif">29 участников · пилотное тестирование</text><rect x="40" y="116" width="206" height="150" rx="14" fill="#FFFFFF" stroke="#DADFD5"/><text x="58" y="166" font-size="32" fill="#426D4F" font-weight="700" font-family="'Segoe UI', Manrope, Arial, sans-serif">4,83 / 5</text><text x="58" y="196" font-size="14" fill="#5F6B63" font-weight="400" font-family="'Segoe UI', Manrope, Arial, sans-serif">удобство с телефона</text><rect x="262" y="116" width="206" height="150" rx="14" fill="#FFFFFF" stroke="#DADFD5"/><text x="280" y="166" font-size="32" fill="#426D4F" font-weight="700" font-family="'Segoe UI', Manrope, Arial, sans-serif">4,79 / 5</text><text x="280" y="196" font-size="14" fill="#5F6B63" font-weight="400" font-family="'Segoe UI', Manrope, Arial, sans-serif">общая оценка QaltaLab</text><rect x="484" y="116" width="206" height="150" rx="14" fill="#FFFFFF" stroke="#DADFD5"/><text x="502" y="166" font-size="32" fill="#426D4F" font-weight="700" font-family="'Segoe UI', Manrope, Arial, sans-serif">100%</text><text x="502" y="196" font-size="14" fill="#5F6B63" font-weight="400" font-family="'Segoe UI', Manrope, Arial, sans-serif">«Да» или «Скорее да»:</text><text x="502" y="215" font-size="14" fill="#5F6B63" font-weight="400" font-family="'Segoe UI', Manrope, Arial, sans-serif">формат помогает понимать</text><text x="502" y="234" font-size="14" fill="#5F6B63" font-weight="400" font-family="'Segoe UI', Manrope, Arial, sans-serif">STEM</text><rect x="706" y="116" width="206" height="150" rx="1