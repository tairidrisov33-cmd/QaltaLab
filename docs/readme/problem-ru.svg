t><text x="40" y="446" font-size="12.5" fill="#8A958C" font-weight="400" font-family="'Segoe UI', Manrope, 'Helvetica Neue', Arial, sans-serif">Источники: Бюро национальной статистики (31.08.2026); Министерство просвещения РК (2024); ОЭСР, PISA 2022.</text></svg>
