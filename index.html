<!doctype html>
<html lang="ru" data-lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>QaltaLab — лаборатория в кармане</title>
<meta name="description" content="QaltaLab превращает телефон в измерительный прибор. Школьник ставит настоящий опыт, собирает свои данные и сам выводит закон — без лаборатории и оборудования.">
<meta name="theme-color" content="#FFFFFF">
<meta property="og:title" content="QaltaLab — зертхана қалтаңда">
<meta property="og:description" content="Оборудование не нужно покупать — оно уже куплено. Настоящие измерения телефоном, свои данные, свой закон.">
<meta property="og:type" content="website">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="app">
  <header class="topbar">
    <button class="brand" id="home" type="button" aria-label="На главную">
      <svg class="brand__mark" viewBox="0 0 32 32" aria-hidden="true">
        <rect class="mk-bg" width="32" height="32" rx="9"/>
        <circle class="mk-fg" cx="14.5" cy="14.5" r="6.4" fill="none" stroke-width="2.6"/>
        <path class="mk-fg" d="M19.6 19.6 L24 24" fill="none" stroke-width="2.6" stroke-linecap="round"/>
      </svg>
      <span class="brand__name">QaltaLab</span>
    </button>
    <div class="topbar__right">
      <div class="segmented" id="lang" role="group" aria-label="Язык">
        <button type="button" data-lang="ru">РУС</button>
        <button type="button" data-lang="kk">ҚАЗ</button>
      </div>
      <button class="icon-btn" id="theme" type="button" aria-label="Тема оформления"></button>
    </div>
  </header>

  <main class="content" id="view"></main>
</div>

<script defer src="js/i18n.js"></script>
<script defer src="js/utils.js"></script>
<script defer src="js/store.js"></script>
<script defer src="js/fit.js"></script>
<script defer src="js/chart.js"></script>
<script defer src="js/lab.js"></script>
<script defer src="js/labs/hearing.js"></script>
<script defer src="js/labs/hick.js"></script>
<script defer src="js/app.js"></script>
</body>
</html>
