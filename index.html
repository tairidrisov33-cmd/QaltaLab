<header class="topbar" id="topbar">

    <button class="brand" id="home" type="button" aria-label="На главную">
      <svg class="brand__mark" viewBox="0 0 32 32" aria-hidden="true">
        <defs><clipPath id="mkf"><path d="M13 6.5 H19 V12.5 L24.8 22.6 A2.6 2.6 0 0 1 22.5 26.5 H9.5 A2.6 2.6 0 0 1 7.2 22.6 L13 12.5 Z"/></clipPath></defs>

        <path class="mk-dot" d="M6 19.2 Q9.5 16.4 13 19.2 T20 19.2 T27 19.2 V28 H6 Z" clip-path="url(#mkf)"/>
        <path class="mk-line" d="M13 6.5 H19 V12.5 L24.8 22.6 A2.6 2.6 0 0 1 22.5 26.5 H9.5 A2.6 2.6 0 0 1 7.2 22.6 L13 12.5 Z" fill="none" stroke-width="2" stroke-linejoin="round"/>

      </svg>
      <span class="brand__name">QaltaLab</span>
    </button>

    <nav class="nav" id="nav" aria-label="Разделы">
      <button type="button" data-to="labs">Опыты</button>
      <button type="button" data-to="how">Как работает</button>
      <button type="button" data-to="teacher">Учителю</button>
      <button type="button" data-to="basis">Основа</button>

    <div class="topbar__right">
      <div class="segmented" id="lang" role="group" aria-label="Язык">

      <button class="icon-btn" id="theme" type="button" aria-label="Тема оформления"></button>
    </div>
  </div>
</header>

<div id="app">
  <noscript>
    <div class="wrap" style="padding-top:40px">
      <h1>QaltaLab</h1>
      <p>Для опытов нужен включённый JavaScript: все измерения считаются прямо в браузере, сервера у проекта нет.</p>
    </div>
  </noscript>

  <main class="content wrap" id="view"></main>
</div>
